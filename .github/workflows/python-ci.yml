name: Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to use
        required: false
        type: string
        default: "3.14"
      checkout-lisa-dependency:
        description: Check out jemuelbjeroham/LISA beside the caller repository
        required: false
        type: boolean
        default: false
    # secrets:
    #   lisa-repository-token:
    #     description: Optional token with read access to jemuelbjeroham/LISA
    #     required: false

permissions:
  contents: read

jobs:
  validate:
    name: Lint, build, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ${{ inputs.checkout-lisa-dependency && 'lisa-api' || '.' }}

      - name: Check out LISA dependency
        if: ${{ inputs.checkout-lisa-dependency }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: jemuelbjeroham/LISA
          path: LISA

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Diagnose LISA dependency checkout
        if: ${{ inputs.checkout-lisa-dependency }}
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "Current working directory: $(pwd)"
          ls -la "$GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE/LISA" || true
          ls -la "$GITHUB_WORKSPACE/lisa-api" || true
          for project_file in LISA/pyproject.toml lisa-api/pyproject.toml; do
            if [[ -f "$GITHUB_WORKSPACE/$project_file" ]]; then
              echo "Found $project_file"
            else
              echo "::error::Missing $project_file under GITHUB_WORKSPACE"
              exit 1
            fi
          done

      - name: Install locked dependencies
        run: uv sync --locked
        working-directory: ${{ inputs.checkout-lisa-dependency && 'lisa-api' || '.' }}

      # Lint, formatting, and tests are temporarily disabled during development/onboarding;
      # restore them as quality gates before production.
      # - name: Lint
      #   run: uv run ruff check .
      # - name: Validate formatting
      #   run: uv run ruff format --check .

      - name: Build package
        run: uv build
        working-directory: ${{ inputs.checkout-lisa-dependency && 'lisa-api' || '.' }}

      # - name: Run deterministic unit tests
      #   env:
      #     OPENAI_API_KEY: ci-placeholder
      #     TAVILY_API_KEY: ci-placeholder
      #     LISA_DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      #   run: uv run pytest tests/unit